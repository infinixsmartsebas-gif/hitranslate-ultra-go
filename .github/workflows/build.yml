name: Build APK
‎on: [push]
‎jobs:
‎  build:
‎    runs-on: ubuntu-latest
‎    steps:
· ‎uses: actions/checkout@v4
· ‎name: Set up JDK 17
‎        uses: actions/setup-java@v4
‎        with:
‎          java-version: '17'
‎          distribution: 'temurin'
· ‎name: Create Android Project
‎        run: |
‎          if [! -f gradlew ]; then
‎            echo "Creando proyecto..."
‎            mkdir -p app/src/main/java/com/hitranslate/ultra
‎            mkdir -p app/src/main/res/layout
‎            mkdir -p app/src/main/res/values
‎            cat > settings.gradle << 'EOF'
‎          include ':app'
‎          EOF
‎            cat > build.gradle << 'EOF'
‎          buildscript {
‎              dependencies {
‎                  classpath 'com.android.tools.build:gradle:8.1.4'
‎              }
‎          }
‎          allprojects { repositories { google(); mavenCentral() } }
‎          EOF
‎            cat > app/build.gradle << 'EOF'
‎          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
‎          android {
‎              namespace 'com.hitranslate.ultra'
‎              compileSdk 34
‎              defaultConfig { applicationId "com.hitranslate.ultra"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
‎              buildTypes { debug { minifyEnabled false } release { minifyEnabled false } }
‎              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
‎          }
‎          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }
‎          EOF
‎            cat > app/src/main/res/values/strings.xml << 'EOF'
‎          <resources><string name="app_name">HiTranslate Ultra Go</string></resources>
‎          EOF
‎            cat > app/src/main/res/values/themes.xml << 'EOF'
‎          <resources><style name="Theme.HiTranslate" parent="Theme.Material3.DayNight"><item name="colorPrimary">#FF6D00</item></style></resources>
‎          EOF
‎            cat > app/src/main/res/layout/activity_main.xml << 'EOF'
‎          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:gravity="center" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#101010"><TextView android:text="HiTranslate Ultra Go\nAPK Generada" android:textSize="24sp" android:textColor="#FFFFFF" android:gravity="center" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout>
‎          EOF
‎            cat > app/src/main/AndroidManifest.xml << 'EOF'
‎          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/Theme.HiTranslate" android:label="HiTranslate Ultra Go"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
‎          EOF
‎            cat > app/src/main/java/com/hitranslate/ultra/MainActivity.kt << 'EOF'
‎          package com.hitranslate.ultra; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; class MainActivity : AppCompatActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main) } }
‎          EOF
‎            cat > gradle.properties << 'EOF'
‎          android.useAndroidX=true
‎          EOF
‎            gradle wrapper --gradle-version 8.5
‎          fi
· ‎name: Setup Android SDK
‎        uses: android-actions/setup-android@v3
· ‎name: Build APK
‎        run: |
‎          chmod +x gradlew
‎         ./gradlew assembleDebug
· ‎name: Upload APK
‎        uses: actions/upload-artifact@v4
‎        with:
‎          name: HiTranslate-Ultra-Go-APK
‎          path: app/build/outputs/apk/debug/app-debug.apk
