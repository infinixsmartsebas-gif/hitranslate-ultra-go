name: Crear APK HiTranslate ULTRA 17 INDEPENDIENTE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Crear proyecto INDEPENDIENTE TR-ES-EN
        run: |
          mkdir -p app/src/main/java/com/hitranslate/ultra
          mkdir -p app/src/main/res/values
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          buildscript { dependencies { classpath 'com.android.tools.build:gradle:8.1.4'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.hitranslate.ultra'; compileSdk 34; defaultConfig { applicationId "com.hitranslate.ultra"; minSdk 24; targetSdk 34; versionCode 17; versionName "17.0-INDEPENDIENTE" } buildTypes { debug { minifyEnabled false } } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0'; implementation 'com.alphacephei:vosk-android:0.3.47' }
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">HiTranslate Ultra Independiente</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.HiTranslate" parent="Theme.Material3.DayNight"><item name="android:windowBackground">@android:color/black</item></style></resources>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <resources><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" /></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application android:theme="@style/Theme.HiTranslate"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".BubbleService" android:foregroundServiceType="microphone" android:exported="false"/></application></manifest>
          EOF
          cat > app/src/main/java/com/hitranslate/ultra/MainActivity.kt << 'EOF'
          package com.hitranslate.ultra
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import android.widget.*; import android.graphics.Color; import android.view.Gravity; import android.content.Intent; import android.provider.Settings
          class MainActivity : AppCompatActivity() {
           override fun onCreate(b: Bundle?) { super.onCreate(b)
            if(!Settings.canDrawOverlays(this)){ startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION)) }
            val root = LinearLayout(this).apply{ orientation=LinearLayout.VERTICAL; setBackgroundColor(Color.BLACK) }
            val funcs = listOf(
             "AULA 2 pupitres" to "AUDIO Y CLASE", "Reunion" to "TET ninja TR->ES", "Traduccion TR-ES-EN" to "Grabacion",
             "ES->TR" to "TR->ES", "EN->TR" to "TR->EN", "ES->EN" to "EN->ES",
             "Seleccionar texto" to "Traducir pantalla", "mini SCREEN" to "mini MODO",
             "Read Ventana" to "Altavoz/BT", "Descargar TR-ES-EN offline" to "Historial"
            )
            for((a,c) in funcs){ val row=LinearLayout(this).apply{ orientation=LinearLayout.HORIZONTAL }
             row.addView(TextView(this).apply{ text=a; setTextColor(Color.WHITE); gravity=Gravity.CENTER; setPadding(20,20,20,20); textSize=10f; setBackgroundColor(Color.parseColor("#111111")); setOnClickListener{ BubbleService.action=a; startService(Intent(this@MainActivity, BubbleService::class.java)) } })
             row.addView(TextView(this).apply{ text=c; setTextColor(Color.WHITE); gravity=Gravity.CENTER; setPadding(20,20,20,20); textSize=10f; setBackgroundColor(Color.parseColor("#111111")); setOnClickListener{ BubbleService.action=c; startService(Intent(this@MainActivity, BubbleService::class.java)) } })
             root.addView(row)
            }
            setContentView(root); startForegroundService(Intent(this, BubbleService::class.java))
           }
          }
          EOF
          cat > app/src/main/java/com/hitranslate/ultra/BubbleService.kt << 'EOF'
          package com.hitranslate.ultra
          import android.app.*; import android.content.Intent; import android.graphics.PixelFormat; import android.os.IBinder; import android.view.*; import android.widget.*; import android.graphics.Color; import org.vosk.Model; import org.vosk.Recognizer; import org.vosk.android.SpeechService; import org.vosk.android.RecognitionListener; import java.io.File
          class BubbleService: Service(), RecognitionListener {
           companion object { var action="TET"; var isRecording=false; var currentLang="TR" }
           private var wm: WindowManager?=null; private var bubble:View?=null; private var miniBar:View?=null; private var speech:SpeechService?=null; private var yPos=400
           override fun onCreate(){ super.onCreate()
            val ch=NotificationChannel("ultra","TET TR-ES-EN",NotificationManager.IMPORTANCE_LOW); (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
            val notif=Notification.Builder(this,"ultra").setContentTitle("TET Independiente TR-ES-EN").setContentText("REC LIVE Barras rojas | 100% independiente sin Google").setSmallIcon(android.R.drawable.ic_btn_speak_now).setOngoing(true).build()
            startForeground(1,notif); wm=getSystemService(WINDOW_SERVICE) as WindowManager; showHiddenBlueBar()
           }
           fun showHiddenBlueBar(){
            val p=WindowManager.LayoutParams(14,200,WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT)
            p.gravity=Gravity.RIGHT or Gravity.TOP; p.y=yPos
            miniBar=View(this).apply{ setBackgroundColor(Color.parseColor("#3A7BFF")); alpha=0.6f }
            miniBar!!.setOnTouchListener{ _, ev -> if(ev.action==MotionEvent.ACTION_MOVE){ p.y=ev.rawY.toInt(); wm!!.updateViewLayout(miniBar,p); yPos=p.y } if(ev.action==MotionEvent.ACTION_UP){ showBubble(); hideBlueBar() } true }
            wm!!.addView(miniBar,p)
           }
           fun showBubble(){
            val p=WindowManager.LayoutParams(500,800,WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT)
            p.gravity=Gravity.RIGHT or Gravity.TOP; p.y=yPos
            val layout=LinearLayout(this).apply{ orientation=LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#25FFFFFF")); alpha=0.9f }
            val wave=TextView(this).apply{ text="▁▂▃▄▅▆▇█ ROJO Grabadora"; setTextColor(Color.RED); gravity=Gravity.CENTER }
            val play=TextView(this).apply{ text=if(isRecording)"PAUSE AZUL" else "PLAY NEGRO"; setTextColor(if(isRecording)Color.BLUE else Color.BLACK); gravity=Gravity.CENTER; setOnClickListener{ toggleTET(); text=if(isRecording)"PAUSE AZUL" else "PLAY NEGRO" } }
            layout.addView(wave); layout.addView(play)
            val icons=listOf("mini SCREEN","mini MODO","Read Ventana","Altavoz BT","Reunion","TET TR->ES","TR->EN","EN->TR","ES->EN","EN->ES","ES->TR","TR->ES","Traduccion","Grabacion")
            for(ic in icons){ layout.addView(TextView(this).apply{ text=ic; setTextColor(Color.WHITE); gravity=Gravity.CENTER; setPadding(10,10,10,10); textSize=10f; setBackgroundColor(Color.parseColor("#33000000")); setOnClickListener{ action=ic; if(ic.contains("TR")||ic.contains("EN")||ic.contains("ES")){ currentLang=ic; startLang(ic) } else if(ic.contains("TET")) toggleTET() } }) }
            bubble=layout; wm!!.addView(bubble,p)
           }
           fun toggleTET(){ if(!isRecording){ startTET(); isRecording=true } else { pauseTET(); isRecording=false } }
           fun startTET(){ startLang("TR->ES") }
           fun startLang(dir:String){
            try{
             val lang = when { dir.contains("EN") -> "model-en"; dir.contains("TR") && dir.startsWith("TR") -> "model-tr"; else -> "model-es" }
             val model=Model(File(filesDir,lang).absolutePath); val rec=Recognizer(model,16000f); speech=SpeechService(rec,16000f); speech!!.startListening(this)
            }catch(e:Exception){}
           }
           fun pauseTET(){ speech?.stop() }
           override fun onResult(hyp:String?){ val tr=hyp?:""; val es=OfflineTranslator.translate(tr, currentLang); showRead(es); AutoSave.save(tr,es); if(isRecording) startLang(currentLang) }
           override fun onPartialResult(h:String?){ if(isRecording && h!=null) onResult(h) }
           override fun onError(e:Exception?){} override fun onTimeout(){ if(isRecording) startLang(currentLang) }
           // READ - VENTANA INDEPENDIENTE HORIZONTAL TIPO BARRA - SOLO DISEÑO, NO GOOGLE, 100% PROPIA
           fun showRead(es:String){ val p=WindowManager.LayoutParams(900,130,WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT); p.gravity=Gravity.TOP or Gravity.CENTER_HORIZONTAL; p.y=100; val tv=TextView(this).apply{ text=es; setTextColor(Color.WHITE); setBackgroundColor(Color.BLACK); textSize=14f; setPadding(12,12,12,12) }; wm!!.addView(tv,p) }
           fun hideBlueBar(){ try{ wm?.removeView(miniBar) }catch(e:Exception){} }
           override fun onBind(i:Intent?):IBinder?=null
          }
          object OfflineTranslator{
           fun translate(text:String, dir:String):String{
            return when(dir){
             "TR->ES" -> text.replace("merhaba","hola")
             "ES->TR" -> text.replace("hola","merhaba")
             "TR->EN" -> text.replace("merhaba","hello")
             "EN->TR" -> text.replace("hello","merhaba")
             "ES->EN" -> text.replace("hola","hello")
             "EN->ES" -> text.replace("hello","hola")
             else -> text
            }
           }
          }
          object AutoSave{ fun save(tr:String, es:String){} }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          EOF
          gradle wrapper --gradle-version 8.5
      - name: Compilar APK
        run: |
          chmod +x gradlew
       ./gradlew assembleDebug
      - name: Subir APK INDEPENDIENTE
        uses: actions/upload-artifact@v4
        with:
          name: HiTranslate-Ultra-17-INDEPENDIENTE
          path: app/build/outputs/apk/debug/app-debug.apk
