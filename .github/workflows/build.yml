name: Build APK
‎on: [push]
‎jobs:
‎  build:
‎    runs-on: ubuntu-latest
‎    steps:
· ‎uses: actions/checkout@v4
· ‎uses: actions/setup-java@v4
‎        with:
‎          java-version: '17'
‎          distribution: 'temurin'
· ‎name: Create Android Project
‎        run: |
‎          mkdir -p app/src/main/java/com/hitranslate/ultra
‎          mkdir -p app/src/main/res/layout
‎          mkdir -p app/src/main/res/values
‎          echo "include ':app'" > settings.gradle
‎          echo "buildscript{dependencies{classpath 'com.android.tools.build:gradle:8.1.4'}} allprojects{repositories{google(); mavenCentral()}}" > build.gradle
‎          echo "plugins{id 'com.android.application'; id 'org.jetbrains.kotlin.android'} android{namespace 'com.hitranslate.ultra'; compileSdk 34; defaultConfig{applicationId 'com.hitranslate.ultra'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0'} buildTypes{release{minifyEnabled false}; debug{minifyEnabled false}} compileOptions{sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17}} dependencies{implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0'}" > app/build.gradle
‎          echo "<resources><string name='app_name'>HiTranslate Ultra Go</string></resources>" > app/src/main/res/values/strings.xml
‎          echo "<resources><style name='Theme.HiTranslate' parent='Theme.Material3.DayNight'><item name='colorPrimary'>#FF6D00</item></style></resources>" > app/src/main/res/values/themes.xml
‎          echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:gravity="center" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#101010"><TextView android:text="HiTranslate Ultra Go" android:textSize="24sp" android:textColor="#FFFFFF" android:gravity="center" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout>' > app/src/main/res/layout/activity_main.xml
‎          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/Theme.HiTranslate" android:label="HiTranslate"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
‎          echo "package com.hitranslate.ultra; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; class MainActivity : AppCompatActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main) } }" > app/src/main/java/com/hitranslate/ultra/MainActivity.kt
‎          echo "android.useAndroidX=true" > gradle.properties
‎          gradle wrapper --gradle-version 8.5
· ‎name: Setup Android SDK
‎        uses: android-actions/setup-android@v3
· ‎name: Build APK
‎        run: |
‎          chmod +x gradlew
‎         ./gradlew assembleDebug
· ‎name: Upload APK
‎        uses: actions/upload-artifact@v4
‎        with:
‎          name: HiTranslate-Ultra-Go-APK
‎          path: app/build/outputs/apk/debug/app-debug.apk
