name: APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Crear
        run: |
          mkdir -p app/src/main/java/com/hitranslate/ultra
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          printf "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }\nandroid { namespace 'com.hitranslate.ultra'; compileSdk 34; defaultConfig { applicationId 'com.hitranslate.ultra'; minSdk 24; targetSdk 34; versionCode 21; versionName '21.0' } }\ndependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }\n" > app/build.gradle
          echo "<resources><string name='app_name'>HiTranslate</string></resources>" > app/src/main/res/values/strings.xml
          echo "<resources><style name='Theme.HiTranslate' parent='Theme.Material3.DayNight'/></resources>" > app/src/main/res/values/themes.xml
          echo "<?xml version='1.0' encoding='utf-8'?><manifest xmlns:android='http
